name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check Supabase env (values hidden)
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL is set: $([ -n \"$NEXT_PUBLIC_SUPABASE_URL\" ] && echo yes || echo no)"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY is set: $([ -n \"$NEXT_PUBLIC_SUPABASE_ANON_KEY\" ] && echo yes || echo no)"

      - name: Build
        run: npm run build
